<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | スキル</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <body class="page-skills">
        <header class="header">
            <div class="container nav-container">
                <a href="index.html" class="logo">ポートフォリオ</a>
                <div class="nav-right" style="display: flex; align-items: center; gap: 15px;">
                    <nav class="nav" id="nav-menu">
                        <ul class="nav-list">
                            <li><a href="index.html">自己紹介</a></li>
                            <li><a href="skills.html" class="active">スキル</a></li>
                            <li><a href="projects.html">プロジェクト</a></li>
                            <li><a href="contact.html">連絡</a></li>
                        </ul>
                    </nav>
                    <button id="theme-toggle" class="theme-btn" title="テーマを切り替える">🌙</button>
                    <button class="burger" id="burger-btn" aria-label="メニュー">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="container" style="margin-top: 100px;">
            <section class="section">
                <h2>技術スキル</h2>
                <div class="skills-grid">
                    <div class="skill-card">
                        <h3>プログラミング言語</h3>
                        <p>Java(基礎), C(基礎)</p>
                    </div>
                    <div class="skill-card">
                        <h3>Web技術</h3>
                        <p>HTML5, CSS3</p>
                    </div>
                    <div class="skill-card">
                        <h3>開発環境・ツール</h3>
                        <p> GitHub, VS Code</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2026 Vitalii Charikov. All rights reserved.</p>
            </div>
        </footer>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const themeToggle = document.getElementById("theme-toggle");
                const body = document.body;

                
                if (localStorage.getItem("theme") === "dark") {
                    body.classList.add("dark-theme");
                    if (themeToggle) themeToggle.textContent = "☀️";
                }

                
                if (themeToggle) {
                    themeToggle.addEventListener("click", () => {
                        body.classList.toggle("dark-theme");

                        if (body.classList.contains("dark-theme")) {
                            localStorage.setItem("theme", "dark");
                            themeToggle.textContent = "☀️";
                        } else {
                            localStorage.setItem("theme", "light");
                            themeToggle.textContent = "🌙";
                        }
                    });
                }
            });
        </script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const burgerBtn = document.getElementById("burger-btn");
                const navMenu = document.getElementById("nav-menu");

                if (burgerBtn && navMenu) {
                    
                    burgerBtn.addEventListener("click", () => {
                        burgerBtn.classList.toggle("active");
                        navMenu.classList.toggle("active");
                    });

                    
                    const navLinks = navMenu.querySelectorAll("a");
                    navLinks.forEach(link => {
                        link.addEventListener("click", () => {
                            burgerBtn.classList.remove("active");
                            navMenu.classList.remove("active");
                        });
                    });
                }
            });
        </script>
    </body>
</html>
